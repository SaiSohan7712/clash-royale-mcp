name: collect-meta
on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collection (also wakes the sleeping free instance)
        run: |
          curl --fail --retry 3 --retry-delay 30 --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.COLLECT_TOKEN }}" \
            "${{ secrets.MCP_BASE_URL }}/collect"
